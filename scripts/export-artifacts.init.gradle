import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportRuntimeArtifacts') {
        doLast {
            def artifacts = app.configurations.getByName('debugRuntimeClasspath').incoming.artifactView {
                componentFilter { id -> id instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts
            def target = new File(gradle.rootProject.projectDir, 'qa/runtime-artifacts.txt')
            target.parentFile.mkdirs()
            target.text = artifacts.collect { it.file.absolutePath }.join('\n')
            println "Exported ${artifacts.size()} runtime artifacts"
            println 'Kotlin output paths: ' + app.tasks.getByName('compileDebugKotlin').outputs.files.files
        }
    }
}
